<!DOCTYPE html>
<html>
<head>
    <title>Firebase Debug</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
        }
        .log { 
            background: #2a2a2a; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
        }
        .error { 
            border-left: 3px solid #f44336; 
            background: #3a1a1a; 
        }
    </style>
</head>
<body>
    <h1>🔍 Firebase Debug Console</h1>
    <div id="logs"></div>

    <script>
        // Add log function
        function addLog(message, isError = false) {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = isError ? 'log error' : 'log';
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
        }

        addLog('🚀 Starting Firebase initialization...');

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDMddaD1sSCjzdT0cYlvcSPl8V-vADWLrw",
            authDomain: "newprooject-c6f66.firebaseapp.com",
            databaseURL: "https://newprooject-c6f66-default-rtdb.firebaseio.com",
            projectId: "newprooject-c6f66",
            storageBucket: "newprooject-c6f66.appspot.com",
            messagingSenderId: "733557611631",
            appId: "1:733557611631:web:3cab8af8fa93b1783b019a"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            addLog('✅ Firebase initialized');
        } catch (error) {
            addLog('❌ Firebase init error: ' + error.message, true);
        }

        const db = firebase.database();

        // Test connection
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                addLog('✅ Connected to Firebase');
            } else {
                addLog('❌ Disconnected from Firebase', true);
            }
        });

        // Listen for devices
        addLog('👂 Listening for devices...');
        db.ref('devices').on('value', (snapshot) => {
            if (snapshot.exists()) {
                addLog(`📱 Found ${snapshot.numChildren()} device(s)`);
                snapshot.forEach((child) => {
                    const device = child.val();
                    addLog(`   Device: ${child.key.substring(0,8)}... - ${device.deviceName} - Status: ${device.status}`);
                });
            } else {
                addLog('❌ No devices found in database', true);
            }
        }, (error) => {
            addLog('❌ Error listening: ' + error.message, true);
        });

        // Check database structure
        db.ref('/').once('value', (snapshot) => {
            if (snapshot.exists()) {
                addLog('✅ Database exists');
                addLog('Structure: ' + JSON.stringify(snapshot.val()).substring(0, 200) + '...');
            } else {
                addLog('❌ Database is empty', true);
            }
        });
    </script>
</body>
</html>
