<!DOCTYPE html>
<html>
<head>
    <title>Device Test with Telegram Debug</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: white; }
        .log { background: #16213e; padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { border-left: 3px solid #4CAF50; }
        .error { border-left: 3px solid #f44336; }
        button { background: #e94560; color: white; border: none; padding: 10px; margin: 5px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>📱 Device Monitor</h1>
    <button onclick="checkDevices()">🔄 Refresh Devices</button>
    <button onclick="sendTestToTelegram()">📤 Send Test to Telegram</button>
    <div id="logs"></div>
    <div id="devices"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDMddaD1sSCjzdT0cYlvcSPl8V-vADWLrw",
            authDomain: "newprooject-c6f66.firebaseapp.com",
            databaseURL: "https://newprooject-c6f66-default-rtdb.firebaseio.com",
            projectId: "newprooject-c6f66",
            storageBucket: "newprooject-c6f66.appspot.com",
            messagingSenderId: "733557611631",
            appId: "1:733557611631:web:3cab8af8fa93b1783b019a"
        };

        const BOT_TOKEN = "8696667868:AAEmf6C_lyLR_KoaSPGDvccFuk1kL78RIFs";
        const CHAT_ID = "-1003927673331";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function addLog(msg, type = '') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.insertBefore(div, logs.firstChild);
        }

        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            }).then(r => r.json()).then(data => {
                if (data.ok) {
                    addLog('✅ Telegram message sent', 'success');
                } else {
                    addLog('❌ Telegram error: ' + JSON.stringify(data), 'error');
                }
            }).catch(err => {
                addLog('❌ Telegram failed: ' + err.message, 'error');
            });
        }

        function sendTestToTelegram() {
            sendToTelegram('🧪 Test message from web panel\n📱 Web client is working!');
        }

        // Check Firebase connection
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                addLog('✅ Connected to Firebase', 'success');
                sendToTelegram('✅ Web panel connected to Firebase');
            } else {
                addLog('❌ Disconnected from Firebase', 'error');
            }
        });

        function checkDevices() {
            addLog('🔍 Checking devices...');
            db.ref('devices').once('value', (snapshot) => {
                const devicesDiv = document.getElementById('devices');
                
                if (!snapshot.exists()) {
                    addLog('❌ No devices in database!', 'error');
                    devicesDiv.innerHTML = '<p style="color:red;">No devices found!</p>';
                    sendToTelegram('❌ Web check: No devices in Firebase');
                    return;
                }

                let html = '<h2>Found Devices:</h2>';
                let deviceCount = 0;
                
                snapshot.forEach((child) => {
                    const device = child.val();
                    deviceCount++;
                    const isOnline = (Date.now() - device.lastSeen) < 30000;
                    
                    html += `
                        <div class="log ${isOnline ? 'success' : 'error'}">
                            <strong>📱 ${device.deviceName}</strong><br>
                            ID: ${child.key.substring(0, 8)}...<br>
                            Status: ${device.status || 'unknown'}<br>
                            Online: ${isOnline ? 'Yes ✅' : 'No ❌'}<br>
                            Last Seen: ${new Date(device.lastSeen).toLocaleString()}
                        </div>
                    `;
                });

                devicesDiv.innerHTML = html;
                addLog(`✅ Found ${deviceCount} device(s)`, 'success');
                sendToTelegram(`📊 Web check: Found ${deviceCount} device(s)`);
            }, (error) => {
                addLog('❌ Error: ' + error.message, 'error');
                sendToTelegram('❌ Web check error: ' + error.message);
            });
        }

        // Auto-check on load
        checkDevices();
        
        // Send startup message
        sendToTelegram('🌐 Web Debug Panel Started');
    </script>
</body>
</html>
