services:
  # Main Auto-Add Server
  - type: web
    name: auto-add-server
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers=1 --threads=2 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
    healthCheckPath: /ping
    autoDeploy: true
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # Daily Report Cron Job (sends report every day at midnight UTC)
  - type: cron
    name: daily-report
    runtime: python
    region: oregon
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python report_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: report-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
