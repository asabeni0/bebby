services:
  - type: web
    name: goldmedal-test-panel
    env: python
    region: oregon  # or singapore, frankfurt, etc.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app -b 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TARGET_SITE
        value: https://goldmedal.cc
    autoDeploy: true
    plan: free
