<!DOCTYPE html>
<html>
<head>
    <title>Remote Device Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .header h1 { color: white; font-size: 24px; }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
        }
        
        .status-badge.connected { background: #4CAF50; }
        .status-badge.disconnected { background: #f44336; }
        
        .main-content { display: flex; gap: 20px; }
        
        .sidebar {
            flex: 0 0 350px;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .device-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .device-card.online {
            border-left: 4px solid #4CAF50;
        }
        
        .device-card.offline {
            border-left: 4px solid #f44336;
            opacity: 0.6;
        }
        
        .device-card.connected {
            border: 2px solid #2196F3;
            background: #e3f2fd;
        }
        
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .device-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }
        
        .device-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            color: white;
        }
        
        .device-status.online { background: #4CAF50; }
        .device-status.offline { background: #f44336; }
        .device-status.connected-status { background: #2196F3; }
        
        .device-info {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .btn-connect { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 8px;
        }
        
        .btn-disconnect {
            background: #f44336;
            color: white;
            width: 100%;
            margin-top: 8px;
        }
        
        .btn-control {
            background: #2196F3;
            color: white;
            margin: 5px;
        }
        
        .control-panel {
            flex: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        
        .control-panel.active { display: block; }
        
        .no-device-selected {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .screen-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        #deviceScreen {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            cursor: crosshair;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .gesture-controls {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .gesture-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        
        .gesture-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .gesture-btn.active {
            background: #667eea;
            color: white;
        }
        
        #textInput {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin: 10px 0;
        }
        
        .streaming-status {
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .pulse {
            width: 10px;
            height: 10px;
            background: #ff9800;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Remote Device Manager</h1>
            <div>
                <span class="status-badge disconnected" id="connectionStatus">
                    🔴 Disconnected
                </span>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Device List Sidebar -->
            <div class="sidebar">
                <h2 style="margin-bottom: 20px; color: #333;">📋 Available Devices</h2>
                <div id="deviceList">
                    <p style="color: #999; text-align: center; padding: 20px;">
                        Loading devices...
                    </p>
                </div>
            </div>
            
            <!-- Control Panel -->
            <div class="control-panel" id="controlPanel">
                <div id="noDeviceSelected" class="no-device-selected">
                    <h2>👈 Select a device to control</h2>
                    <p>Click on a device from the list</p>
                </div>
                
                <div id="deviceControls" style="display: none;">
                    <h2 id="connectedDeviceName" style="color: #333; margin-bottom: 10px;"></h2>
                    
                    <!-- Streaming Controls -->
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button class="btn btn-control" onclick="startStreaming()" style="background: #4CAF50;">
                            ▶ Start Streaming
                        </button>
                        <button class="btn btn-control" onclick="stopStreaming()" style="background: #f44336;">
                            ⏹ Stop Streaming
                        </button>
                        <button class="btn btn-disconnect" onclick="disconnectDevice()" style="width: auto; margin: 0;">
                            🔌 Disconnect
                        </button>
                    </div>
                    
                    <div class="streaming-status" id="streamingStatus" style="display: none;">
                        <div class="pulse"></div>
                        <span>Streaming active...</span>
                    </div>
                    
                    <!-- Screen Display -->
                    <div class="screen-container">
                        <img id="deviceScreen" alt="Device Screen" />
                    </div>
                    
                    <!-- Navigation Controls -->
                    <div class="control-buttons">
                        <button class="btn btn-control" onclick="sendKey(3)">🏠 Home</button>
                        <button class="btn btn-control" onclick="sendKey(4)">⬅ Back</button>
                        <button class="btn btn-control" onclick="sendKey(187)">📋 Recent</button>
                        <button class="btn btn-control" onclick="sendKey(24)">🔊 Vol+</button>
                        <button class="btn btn-control" onclick="sendKey(25)">🔉 Vol-</button>
                        <button class="btn btn-control" onclick="sendKey(26)">🔒 Power</button>
                    </div>
                    
                    <!-- Touch Controls -->
                    <div class="gesture-controls">
                        <h3>🖱 Touch Controls</h3>
                        <div class="gesture-buttons">
                            <button class="gesture-btn active" onclick="setMode('tap')">👆 Tap</button>
                            <button class="gesture-btn" onclick="setMode('swipe')">👈 Swipe</button>
                            <button class="gesture-btn" onclick="setMode('longpress')">⏱ Long Press</button>
                        </div>
                        <input type="text" id="textInput" placeholder="Type text and press Enter..." 
                               onkeypress="if(event.key==='Enter') sendText()">
                        <button class="btn btn-control" onclick="sendText()">📝 Send Text</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDMddaD1sSCjzdT0cYlvcSPl8V-vADWLrw",
            authDomain: "newprooject-c6f66.firebaseapp.com",
            databaseURL: "https://newprooject-c6f66-default-rtdb.firebaseio.com",
            projectId: "newprooject-c6f66",
            storageBucket: "newprooject-c6f66.appspot.com",
            messagingSenderId: "733557611631",
            appId: "1:733557611631:web:3cab8af8fa93b1783b019a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let selectedDeviceId = null;
        let gestureMode = 'tap';
        let screenScaleX = 1;
        let screenScaleY = 1;
        let screenListener = null;
        
        // Connection status
        db.ref('.info/connected').on('value', (snap) => {
            const badge = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                badge.textContent = '🟢 Connected to Firebase';
                badge.className = 'status-badge connected';
            } else {
                badge.textContent = '🔴 Disconnected';
                badge.className = 'status-badge disconnected';
            }
        });
        
        // Load devices
        function loadDevices() {
            db.ref('devices').on('value', (snapshot) => {
                const deviceList = document.getElementById('deviceList');
                deviceList.innerHTML = '';
                
                if (!snapshot.exists()) {
                    deviceList.innerHTML = '<p style="text-align:center;color:#999;">No devices found</p>';
                    return;
                }
                
                snapshot.forEach((child) => {
                    const device = child.val();
                    const deviceId = child.key;
                    const isOnline = (Date.now() - device.lastSeen) < 30000;
                    const isConnected = device.connectionStatus === 'connected';
                    
                    const card = document.createElement('div');
                    card.className = `device-card ${isOnline ? 'online' : 'offline'} ${isConnected ? 'connected' : ''}`;
                    
                    let statusText = isOnline ? 'Online' : 'Offline';
                    let statusClass = isOnline ? 'online' : 'offline';
                    if (isConnected) {
                        statusText = 'Connected';
                        statusClass = 'connected-status';
                    }
                    
                    card.innerHTML = `
                        <div class="device-header">
                            <span class="device-name">📱 ${device.deviceName || 'Unknown'}</span>
                            <span class="device-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="device-info">
                            Android ${device.androidVersion || 'N/A'}<br>
                            Screen: ${device.screenWidth || '?'}×${device.screenHeight || '?'}<br>
                            Last seen: ${new Date(device.lastSeen).toLocaleTimeString()}
                        </div>
                        ${!isConnected ? 
                            `<button class="btn btn-connect" onclick="connectToDevice('${deviceId}')">
                                🔗 Connect
                            </button>` :
                            `<button class="btn btn-disconnect" onclick="disconnectDevice()">
                                🔌 Disconnect
                            </button>`
                        }
                    `;
                    
                    deviceList.appendChild(card);
                });
            });
        }
        
        // Connect to device
        function connectToDevice(deviceId) {
            // Set connection request
            db.ref('devices/' + deviceId + '/connectionRequest').set('connect');
            
            // Listen for connection acceptance
            const connectionRef = db.ref('devices/' + deviceId + '/connectionStatus');
            connectionRef.on('value', (snapshot) => {
                if (snapshot.val() === 'connected') {
                    selectedDeviceId = deviceId;
                    document.getElementById('controlPanel').classList.add('active');
                    document.getElementById('noDeviceSelected').style.display = 'none';
                    document.getElementById('deviceControls').style.display = 'block';
                    document.getElementById('connectedDeviceName').textContent = 
                        `Connected to: ${deviceId.substring(0, 8)}...`;
                    
                    // Start listening to screen
                    listenToScreen(deviceId);
                    
                    connectionRef.off();
                    alert('Connected to device!');
                }
            });
            
            // Timeout after 10 seconds
            setTimeout(() => {
                connectionRef.off();
                if (!selectedDeviceId) {
                    alert('Connection timeout. Make sure the device is online.');
                    db.ref('devices/' + deviceId + '/connectionRequest').remove();
                }
            }, 10000);
        }
        
        // Disconnect
        function disconnectDevice() {
            if (selectedDeviceId) {
                db.ref('devices/' + selectedDeviceId + '/connectionRequest').set('disconnect');
                stopStreaming();
                
                if (screenListener) {
                    db.ref('devices/' + selectedDeviceId + '/screen').off('value', screenListener);
                }
                
                selectedDeviceId = null;
                document.getElementById('controlPanel').classList.remove('active');
                document.getElementById('deviceControls').style.display = 'none';
                document.getElementById('noDeviceSelected').style.display = 'block';
                document.getElementById('streamingStatus').style.display = 'none';
            }
        }
        
        // Screen streaming
        function listenToScreen(deviceId) {
            if (screenListener) {
                db.ref('devices/' + selectedDeviceId + '/screen').off('value', screenListener);
            }
            
            screenListener = db.ref('devices/' + deviceId + '/screen').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.image) {
                    document.getElementById('deviceScreen').src = 'data:image/jpeg;base64,' + data.image;
                    document.getElementById('streamingStatus').style.display = 'flex';
                    
                    if (data.width && data.height) {
                        const screen = document.getElementById('deviceScreen');
                        screenScaleX = data.width / screen.clientWidth;
                        screenScaleY = data.height / screen.clientHeight;
                    }
                }
            });
        }
        
        function startStreaming() {
            if (selectedDeviceId) {
                sendCommand({ type: 'start_streaming' });
            }
        }
        
        function stopStreaming() {
            if (selectedDeviceId) {
                sendCommand({ type: 'stop_streaming' });
                document.getElementById('streamingStatus').style.display = 'none';
            }
        }
        
        // Send commands
        function sendCommand(data) {
            if (!selectedDeviceId) return;
            db.ref('devices/' + selectedDeviceId + '/commands').push(data);
        }
        
        function sendKey(keyCode) {
            sendCommand({ type: 'key_event', keyCode: keyCode });
        }
        
        function sendText() {
            const text = document.getElementById('textInput').value;
            if (text) {
                sendCommand({ type: 'text_input', text: text });
                document.getElementById('textInput').value = '';
            }
        }
        
        function setMode(mode) {
            gestureMode = mode;
            document.querySelectorAll('.gesture-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        // Touch handling on screen
        document.addEventListener('DOMContentLoaded', () => {
            const screen = document.getElementById('deviceScreen');
            
            screen.addEventListener('mousedown', (e) => {
                if (!selectedDeviceId) return;
                const rect = screen.getBoundingClientRect();
                const x = (e.clientX - rect.left) * screenScaleX;
                const y = (e.clientY - rect.top) * screenScaleY;
                
                if (gestureMode === 'tap' || gestureMode === 'longpress') {
                    sendCommand({ type: 'touch', x: Math.round(x), y: Math.round(y) });
                }
                
                screen.dataset.startX = x;
                screen.dataset.startY = y;
            });
            
            screen.addEventListener('mouseup', (e) => {
                if (!selectedDeviceId || gestureMode !== 'swipe') return;
                const rect = screen.getBoundingClientRect();
                const endX = (e.clientX - rect.left) * screenScaleX;
                const endY = (e.clientY - rect.top) * screenScaleY;
                
                sendCommand({
                    type: 'swipe',
                    startX: Math.round(parseFloat(screen.dataset.startX)),
                    startY: Math.round(parseFloat(screen.dataset.startY)),
                    endX: Math.round(endX),
                    endY: Math.round(endY)
                });
            });
            
            // Mobile touch support
            screen.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!selectedDeviceId) return;
                const touch = e.touches[0];
                const rect = screen.getBoundingClientRect();
                const x = (touch.clientX - rect.left) * screenScaleX;
                const y = (touch.clientY - rect.top) * screenScaleY;
                
                screen.dataset.startX = x;
                screen.dataset.startY = y;
                sendCommand({ type: 'touch', x: Math.round(x), y: Math.round(y) });
            });
            
            screen.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!selectedDeviceId) return;
                const touch = e.changedTouches[0];
                const rect = screen.getBoundingClientRect();
                const endX = (touch.clientX - rect.left) * screenScaleX;
                const endY = (touch.clientY - rect.top) * screenScaleY;
                
                sendCommand({
                    type: 'swipe',
                    startX: Math.round(parseFloat(screen.dataset.startX)),
                    startY: Math.round(parseFloat(screen.dataset.startY)),
                    endX: Math.round(endX),
                    endY: Math.round(endY)
                });
            });
        });
        
        // Initialize
        loadDevices();
    </script>
</body>
</html>
